schema_version: 1
name: PCA with Outlier Diagnostics
slug: pca
description: 'Detailed PCA workflow with scores, loadings, scree plots, Hotelling
  T-squared, and Q residuals for outlier diagnostics.'
category: exploratory
is_active: true
data_modalities:
- spectra
- features
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Load Data
    parameters:
      source: spectrochempy
      example_dataset: irdata
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: preprocess.scale
    label: Mean Center
    parameters:
      method: mean_center
    position_x: 425
    position_y: 300
  - node_id: model_1
    node_type: model.pca
    label: Fit PCA Transform
    parameters:
      n_components: 2
    position_x: 175
    position_y: 550
  - node_id: viz_1
    node_type: output.plot
    label: Scores
    parameters:
      plot_type: scores
    position_x: 50
    position_y: 800
  - node_id: viz_2
    node_type: output.plot
    label: Loadings
    parameters:
      plot_type: spectra
    position_x: 850
    position_y: 800
  - node_id: viz_3
    node_type: output.plot
    label: Variance
    parameters:
      plot_type: spectra
    position_x: 1250
    position_y: 800
  - node_id: stats_1
    node_type: stats.summary
    label: Summary
    parameters: {}
    position_x: 450
    position_y: 800
  edges:
  - from_node_id: data_1
    to_node_id: preprocess_1
    to_input: default
  - from_node_id: preprocess_1
    to_node_id: model_1
  - from_node_id: model_1
    to_node_id: viz_1
    from_output: scores
  - from_node_id: model_1
    to_node_id: viz_2
    from_output: loadings
  - from_node_id: model_1
    to_node_id: viz_3
    from_output: explained_variance
  - from_node_id: model_1
    to_node_id: stats_1
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Spectral data matrix
      accepted_data_roles:
      - X_spectra
      - X_features
      accepted_techniques:
      - FTIR
      - NIR
      - Raman
      - UV-Vis
      - OES
  certified_datasets:
  - source: spectrochempy
    name: irdata
  - source: spectrochempy
    name: ramandata
  - source: spectrochempy
    name: matlabdata/als2004dataset.MAT
  - source: eigenvector
    name: diesel_nir
  - source: eigenvector
    name: corn_m5
  - source: eigenvector
    name: corn_mp5
  - source: eigenvector
    name: corn_mp6
  - source: eigenvector
    name: cgl_nir
  - source: eigenvector
    name: diesel_nir_mat
  - source: eigenvector
    name: metal_etch_oes
  - source: eigenvector
    name: nir_shootout_cal1
  - source: eigenvector
    name: nir_shootout_cal2
  - source: eigenvector
    name: nir_shootout_test1
  - source: eigenvector
    name: nir_shootout_test2
  - source: sklearn
    name: wine
  - source: sklearn
    name: iris
  - source: oes
    name: uvspectra10
