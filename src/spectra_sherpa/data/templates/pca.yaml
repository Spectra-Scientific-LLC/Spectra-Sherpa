schema_version: 1
name: PCA Exploration & Outlier Diagnostics
slug: pca
description: 'Three-component PCA exploration with role-appropriate scaling, interactive scores,
  loadings, explained variance, Hotelling T-squared, and Q-residual diagnostics.'
category: exploratory
is_active: true
status: ready
data_modalities:
- spectra
- features
- hsi
template_data:
  nodes:
  - node_id: data_1
    node_type: data.file_load
    label: Load Data
    parameters: {}
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: preprocess.scale
    label: Mean Center
    parameters:
      method: mean_center
    position_x: 425
    position_y: 300
  - node_id: inclusion_1
    node_type: data.filter_samples
    label: Filter
    parameters:
      field: source_inclusion
      pattern: ''
      match_mode: contains
      case_sensitive: false
      invert: false
      sample_table_column: ''
      allow_empty: false
      intensity_metric: max
      intensity_operator: gte
      intensity_threshold: 0.0
      intensity_upper_threshold: 1.0
      filter_values: null
    position_x: 175
    position_y: 300
  - node_id: model_1
    node_type: model.pca
    label: Fit PCA Transform
    parameters:
      n_components: "3"
    position_x: 175
    position_y: 550
  - node_id: viz_1
    node_type: output.plot
    label: Scores
    parameters:
      plot_type: scores
    position_x: 50
    position_y: 800
  - node_id: viz_2
    node_type: output.plot
    label: Loadings
    parameters:
      plot_type: loadings
    position_x: 850
    position_y: 800
  - node_id: viz_3
    node_type: output.plot
    label: Explained Variance
    parameters:
      plot_type: explained_variance
    position_x: 1250
    position_y: 800
  - node_id: stats_1
    node_type: stats.summary
    label: Summary
    parameters: {}
    position_x: 450
    position_y: 800
  - node_id: outliers_1
    node_type: diagnostics.outliers
    label: Screen PCA Outliers
    parameters:
      confidence_level: 0.95
    position_x: 750
    position_y: 550
  edges:
  - from_node_id: data_1
    to_node_id: inclusion_1
    to_input: X
  - from_node_id: inclusion_1
    to_node_id: preprocess_1
    to_input: default
  - from_node_id: preprocess_1
    to_node_id: model_1
  - from_node_id: model_1
    to_node_id: viz_1
    from_output: scores
  - from_node_id: model_1
    to_node_id: viz_2
    from_output: loadings
  - from_node_id: model_1
    to_node_id: viz_3
    from_output: explained_variance
  - from_node_id: model_1
    to_node_id: stats_1
  - from_node_id: model_1
    to_node_id: outliers_1
    from_output: diagnostic_state
    to_input: default
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Spectral data matrix
      accepted_data_roles:
      - X_spectra
      - X_features
      - X_hsi
      accepted_techniques:
      - FTIR
      - NIR
      - Raman
      - UV-Vis
      - OES
      - Hyperspectral image
  certified_datasets:
  - source: eigenvector
    name: diesel_nir
  - source: eigenvector
    name: corn_m5
  - source: eigenvector
    name: corn_mp5
  - source: eigenvector
    name: corn_mp6
  - source: eigenvector
    name: cgl_nir
  - source: eigenvector
    name: diesel_nir_mat
  - source: eigenvector
    name: metal_etch_oes
  - source: eigenvector
    name: nir_shootout_cal1
  - source: eigenvector
    name: nir_shootout_cal2
  - source: eigenvector
    name: nir_shootout_test1
  - source: eigenvector
    name: nir_shootout_test2
  - source: sklearn
    name: wine
  - source: sklearn
    name: iris
  - source: oes
    name: uvspectra10
