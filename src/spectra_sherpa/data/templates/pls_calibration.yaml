schema_version: 1
name: PLS Regression Calibration
slug: pls_calibration
description: Build a PLS regression model for quantitative calibration. Includes preprocessing,
  PLS modeling, and prediction diagnostics with the Eigenvector corn NIR dataset.
category: calibration
is_active: true
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Load Calibration Data
    parameters:
      source: eigenvector
      eigenvector_dataset: corn_m5
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: preprocess.smooth
    label: Savitzky-Golay
    parameters:
      method: savitzky_golay
      size: 15
      order: 2
    position_x: 425
    position_y: 300
  - node_id: model_1
    node_type: model.pls
    label: PLS Regression
    parameters:
      n_components: 3
    position_x: 175
    position_y: 550
  - node_id: stats_1
    node_type: stats.summary
    label: Model Diagnostics
    parameters: {}
    position_x: 50
    position_y: 800
  - node_id: viz_1
    node_type: output.plot
    label: Predicted vs Actual
    parameters:
      plot_type: spectra
    position_x: 450
    position_y: 800
  edges:
  - from_node_id: data_1
    to_node_id: preprocess_1
  - from_node_id: preprocess_1
    to_node_id: model_1
  - from_node_id: model_1
    to_node_id: stats_1
  - from_node_id: model_1
    to_node_id: viz_1
    from_output: Y_scores
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Spectral data with concentration/property target values
      accepted_techniques:
      - FTIR
      - NIR
      - Raman
    Y_reference:
      role_type: Y_reference
      node_binding: data_1
      required: true
      binding_mode: embedded
      target_type: continuous
      description: Reference/target values (column in spectral data file)
  certified_datasets:
  - source: eigenvector
    name: corn_m5
  - source: eigenvector
    name: corn_mp5
  - source: eigenvector
    name: corn_mp6
  - source: eigenvector
    name: diesel_nir
  - source: eigenvector
    name: cgl_nir
  - source: eigenvector
    name: diesel_nir_mat
  - source: eigenvector
    name: nir_shootout_cal1
  - source: eigenvector
    name: nir_shootout_cal2
  - source: eigenvector
    name: nir_shootout_test1
  - source: eigenvector
    name: nir_shootout_test2
