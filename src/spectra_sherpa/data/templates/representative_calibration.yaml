schema_version: 1
name: Representative Calibration (Kennard-Stone)
slug: representative_calibration
description: PLS calibration with Kennard-Stone partitioning for representative X-space
  coverage. Reports RMSEP and R² on a held-out test set.
category: selection_design
is_active: true
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Load Spectral Data
    parameters:
      source: eigenvector
      eigenvector_dataset: corn_m5
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: preprocess.smooth
    label: Savitzky-Golay Smooth
    parameters:
      method: savitzky_golay
      size: 15
      order: 2
    position_x: 175
    position_y: 250
  - node_id: partition_1
    node_type: selection.sample_partition
    label: Train/Test Split
    parameters:
      method: kennard_stone
      test_size: 0.25
      metric: euclidean
      n_pcs: 5
    position_x: 175
    position_y: 450
  - node_id: model_1
    node_type: model.pls
    label: Train PLS Regression
    parameters:
      n_components: 4
      scale: false
    position_x: 175
    position_y: 700
  - node_id: predict_1
    node_type: model.pls_predict
    label: Predict Test Set
    parameters: {}
    position_x: 500
    position_y: 700
  - node_id: eval_1
    node_type: diagnostics.holdout_evaluation
    label: Test Evaluation
    parameters:
      task_type: regression
    position_x: 500
    position_y: 900
  - node_id: table_1
    node_type: output.data_table
    label: Test Metrics
    parameters: {}
    position_x: 175
    position_y: 1100
  - node_id: viz_1
    node_type: output.plot
    label: Predicted vs Actual
    parameters:
      plot_type: scatter
    position_x: 500
    position_y: 1100
  edges:
  - from_node_id: data_1
    to_node_id: preprocess_1
  - from_node_id: preprocess_1
    to_node_id: partition_1
    to_input: X
  - from_node_id: partition_1
    to_node_id: model_1
    from_output: X_train
    to_input: X
  - from_node_id: partition_1
    to_node_id: predict_1
    from_output: X_test
    to_input: X_new
  - from_node_id: model_1
    to_node_id: predict_1
    from_output: model
    to_input: model
  - from_node_id: predict_1
    to_node_id: eval_1
    from_output: y_pred
    to_input: y_pred
  - from_node_id: partition_1
    to_node_id: eval_1
    from_output: y_test
    to_input: y_true
  - from_node_id: model_1
    to_node_id: eval_1
    from_output: y_pred
    to_input: y_train_pred
  - from_node_id: model_1
    to_node_id: eval_1
    from_output: y_true
    to_input: y_train_true
  - from_node_id: eval_1
    to_node_id: table_1
    from_output: metrics
  - from_node_id: eval_1
    to_node_id: viz_1
    from_output: visualization
  canvas_state:
    zoom: 0.85
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Spectral data with concentration targets
      accepted_techniques:
      - FTIR
      - NIR
      - Raman
    Y_reference:
      role_type: Y_reference
      node_binding: data_1
      required: true
      binding_mode: embedded
      target_type: continuous
      description: Reference values (embedded in spectral data file)
  certified_datasets:
  - source: eigenvector
    name: corn_m5
  - source: eigenvector
    name: corn_mp5
  - source: eigenvector
    name: corn_mp6
  - source: eigenvector
    name: diesel_nir
  - source: eigenvector
    name: cgl_nir
  - source: eigenvector
    name: diesel_nir_mat
  - source: eigenvector
    name: nir_shootout_cal1
  - source: eigenvector
    name: nir_shootout_cal2
  - source: eigenvector
    name: nir_shootout_test1
  - source: eigenvector
    name: nir_shootout_test2
