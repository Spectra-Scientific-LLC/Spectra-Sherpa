schema_version: 1
name: Classification (PLS-DA)
slug: classification_plsda
description: Supervised PLS2 discriminant analysis with stratified train/test split.
  Scaling is fitted on the training partition and retained in the fitted model;
  the separate evaluator reports held-out classification evidence.
category: classification
is_active: true
status: ready
data_modalities:
- spectra
- features
template_data:
  nodes:
  - node_id: data_1
    node_type: data.file_load
    label: Load Data
    parameters: {}
    example_binding:
      source: sklearn
      dataset_name: wine
      selected_target: target
      target_type: categorical
    position_x: 175
    position_y: 50
  - node_id: partition_1
    node_type: data.train_test_split
    label: Train/Test Split
    parameters:
      split_method: stratified
      test_size: 0.25
      random_seed: 42
    position_x: 175
    position_y: 250
  - node_id: model_1
    node_type: classification.plsda
    label: Train PLS-DA Classifier
    parameters:
      n_components: 2
      scale: true
    position_x: 175
    position_y: 650
  - node_id: predict_1
    node_type: classification.apply_plsda
    label: Predict Test Set
    parameters: {}
    position_x: 500
    position_y: 650
  - node_id: eval_1
    node_type: diagnostics.classification_evaluator
    label: Test Evaluation
    parameters: {}
    position_x: 500
    position_y: 850
  edges:
  - from_node_id: data_1
    to_node_id: partition_1
    to_input: X
  - from_node_id: data_1
    to_node_id: partition_1
    from_output: target
    to_input: y
  - from_node_id: partition_1
    to_node_id: model_1
    from_output: X_train
    to_input: X
  - from_node_id: partition_1
    to_node_id: model_1
    from_output: y_train
    to_input: y
  - from_node_id: partition_1
    to_node_id: predict_1
    from_output: X_test
    to_input: default
  - from_node_id: model_1
    to_node_id: predict_1
    from_output: fitted_state
    to_input: fitted_state
  - from_node_id: predict_1
    to_node_id: eval_1
    from_output: y_pred
    to_input: default
  - from_node_id: partition_1
    to_node_id: eval_1
    from_output: y_test
    to_input: y_true
  canvas_state:
    zoom: 0.85
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Spectral data with class labels
      accepted_data_roles:
      - X_spectra
      - X_features
      accepted_techniques:
      - FTIR
      - NIR
      - Raman
    class_labels:
      role_type: class_labels
      node_binding: data_1
      required: true
      binding_mode: embedded
      target_type: categorical
      description: Classification labels (column in spectral data file)
  certified_datasets:
  - source: sklearn
    name: wine
  - source: sklearn
    name: iris
  - source: sklearn
    name: breast_cancer
