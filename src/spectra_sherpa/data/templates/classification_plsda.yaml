schema_version: 1
name: Classification (PLS-DA)
slug: classification_plsda
description: Supervised classification with PLS-DA. Autoscaling preserves class-discriminant
  variance before PLS-DA extracts latent variables that maximize class separation.
category: classification
is_active: true
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Load Data
    parameters:
      source: sklearn
      sklearn_dataset: wine
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: preprocess.scale
    label: Autoscale
    parameters:
      method: autoscale
    position_x: 425
    position_y: 300
  - node_id: model_1
    node_type: classification.plsda
    label: PLS-DA
    parameters:
      n_components: 5
    position_x: 175
    position_y: 550
  - node_id: viz_1
    node_type: output.plot
    label: Classification Scores
    parameters:
      plot_type: spectra
    position_x: 425
    position_y: 800
  edges:
  - from_node_id: data_1
    to_node_id: preprocess_1
  - from_node_id: preprocess_1
    to_node_id: model_1
  - from_node_id: model_1
    to_node_id: viz_1
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Spectral data with class labels
      accepted_techniques:
      - FTIR
      - NIR
      - Raman
    class_labels:
      role_type: class_labels
      node_binding: data_1
      required: true
      binding_mode: embedded
      target_type: categorical
      description: Classification labels (column in spectral data file)
