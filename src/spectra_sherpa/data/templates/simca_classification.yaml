schema_version: 1
name: SIMCA Classification
slug: simca_classification
description: Class-wise PCA acceptance models with a stratified train/test split and explicit held-out evaluation.
category: classification
is_active: true
status: ready
data_modalities:
- spectra
- features
template_data:
  nodes:
  - node_id: data_1
    node_type: data.file_load
    label: Load Data
    parameters: {}
    example_binding:
      source: sklearn
      dataset_name: wine
      selected_target: target
      target_type: categorical
    position_x: 175
    position_y: 50
  - node_id: partition_1
    node_type: data.train_test_split
    label: Train/Test Split
    parameters:
      split_method: stratified
      test_size: 0.25
      random_seed: 42
    position_x: 175
    position_y: 250
  - node_id: model_1
    node_type: classification.simca
    label: Train SIMCA Classifier
    parameters:
      n_components: 2
      confidence_level: 0.95
      critical_limits_method: ddmoments
    position_x: 175
    position_y: 500
  - node_id: predict_1
    node_type: classification.apply_simca
    label: Apply Fitted SIMCA
    parameters: {}
    position_x: 500
    position_y: 500
  - node_id: eval_1
    node_type: diagnostics.classification_evaluator
    label: Held-Out Evaluation
    parameters: {}
    position_x: 500
    position_y: 750
  edges:
  - from_node_id: data_1
    to_node_id: partition_1
    to_input: X
  - from_node_id: data_1
    to_node_id: partition_1
    from_output: target
    to_input: y
  - from_node_id: partition_1
    to_node_id: model_1
    from_output: X_train
    to_input: X
  - from_node_id: partition_1
    to_node_id: model_1
    from_output: y_train
    to_input: y
  - from_node_id: partition_1
    to_node_id: predict_1
    from_output: X_test
    to_input: X_new
  - from_node_id: model_1
    to_node_id: predict_1
    from_output: fitted_state
    to_input: fitted_state
  - from_node_id: predict_1
    to_node_id: eval_1
    from_output: y_pred
    to_input: default
  - from_node_id: partition_1
    to_node_id: eval_1
    from_output: y_test
    to_input: y_true
  canvas_state:
    zoom: 0.85
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Feature data with class labels for class-wise PCA modeling
      accepted_data_roles:
      - X_spectra
      - X_features
      accepted_techniques:
      - NIR
      - FTIR
      - Raman
      - UV-Vis
    class_labels:
      role_type: class_labels
      node_binding: data_1
      required: true
      binding_mode: embedded
      target_type: categorical
      description: Classification labels stored with the source dataset
  certified_datasets:
  - source: sklearn
    name: wine
  - source: sklearn
    name: iris
  - source: sklearn
    name: breast_cancer
