schema_version: 1
name: SIMCA Classification
slug: simca_classification
description: Soft Independent Modelling of Class Analogy. Autoscale features, build
  per-class PCA models, and classify samples by residual distance to each class model.
category: classification
is_active: true
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Training Data
    parameters:
      source: sklearn
      sklearn_dataset: wine
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: preprocess.scale
    label: Autoscale
    parameters:
      method: autoscale
    position_x: 425
    position_y: 300
  - node_id: model_1
    node_type: classification.simca
    label: SIMCA
    parameters:
      n_components: 3
      alpha: 0.05
    position_x: 175
    position_y: 550
  - node_id: viz_1
    node_type: output.plot
    label: Results
    parameters:
      plot_type: spectra
    position_x: 425
    position_y: 800
  edges:
  - from_node_id: data_1
    to_node_id: preprocess_1
  - from_node_id: preprocess_1
    to_node_id: model_1
  - from_node_id: model_1
    to_node_id: viz_1
    from_output: default
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Reference class samples for training
      accepted_techniques:
      - NIR
      - FTIR
      - Raman
    class_labels:
      role_type: class_labels
      node_binding: data_1
      required: true
      binding_mode: embedded
      target_type: categorical
      description: Classification labels (column in spectral data file)
