schema_version: 1
name: Evolving Factor Analysis
slug: efa_analysis
description: Determine the number of components in evolving mixtures with forward/backward
  EFA and eigenvalue plots.
category: curve_resolution
is_active: true
status: wip
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Load Data
    parameters:
      source: spectrochempy
      example_dataset: irdata
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: preprocess.scale
    label: Mean Center
    parameters:
      method: mean_center
    position_x: 425
    position_y: 300
  - node_id: model_1
    node_type: model.efa
    label: EFA
    parameters:
      n_components: 10
    position_x: 175
    position_y: 550
  - node_id: viz_1
    node_type: output.plot
    label: Forward EFA
    parameters:
      plot_type: spectra
    position_x: 50
    position_y: 800
  - node_id: viz_2
    node_type: output.plot
    label: Backward EFA
    parameters:
      plot_type: spectra
    position_x: 450
    position_y: 800
  - node_id: stats_1
    node_type: stats.summary
    label: Forward Summary
    parameters: {}
    position_x: 100
    position_y: 1050
  - node_id: stats_2
    node_type: stats.summary
    label: Backward Summary
    parameters: {}
    position_x: 500
    position_y: 1050
  edges:
  - from_node_id: data_1
    to_node_id: preprocess_1
  - from_node_id: preprocess_1
    to_node_id: model_1
  - from_node_id: model_1
    to_node_id: viz_1
    from_output: forward_eigenvalues
  - from_node_id: model_1
    to_node_id: viz_2
    from_output: backward_eigenvalues
  - from_node_id: viz_1
    to_node_id: stats_1
  - from_node_id: viz_2
    to_node_id: stats_2
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Evolving mixture spectral data
      accepted_techniques:
      - FTIR
      - NIR
      - Raman
      - UV-Vis
