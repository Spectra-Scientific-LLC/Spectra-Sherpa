schema_version: 1
name: NMR Processing Workflow
slug: nmr_processing
description: Phase correction, polynomial baseline, ppm slicing, CWT peak picking,
  and Lorentzian peak fitting.
category: spectroscopy
is_active: true
status: wip
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Load NMR Data
    parameters:
      source: spectrochempy
      example_dataset: nmrdata
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: preprocess.smooth
    label: Smoothing
    parameters:
      method: savitzky_golay
      size: 11
      order: 2
    position_x: 425
    position_y: 300
  - node_id: preprocess_2
    node_type: baseline.penalized_ls
    label: Baseline Correction
    parameters:
      method: als
      lam: 100000
      p: 0.001
    position_x: 175
    position_y: 550
  - node_id: preprocess_3
    node_type: preprocess.clip_range
    label: PPM Range
    parameters:
      min_wavenumber: 0
      max_wavenumber: 12
    position_x: 425
    position_y: 800
  - node_id: analysis_1
    node_type: analysis.peak_finding
    label: Peak Detection
    parameters: {}
    position_x: 175
    position_y: 1050
  - node_id: viz_1
    node_type: output.plot
    label: NMR Spectrum
    parameters:
      plot_type: spectra
    position_x: 50
    position_y: 1300
  - node_id: stats_1
    node_type: stats.summary
    label: Peak Table
    parameters: {}
    position_x: 450
    position_y: 1300
  edges:
  - from_node_id: data_1
    to_node_id: preprocess_1
  - from_node_id: preprocess_1
    to_node_id: preprocess_2
  - from_node_id: preprocess_2
    to_node_id: preprocess_3
  - from_node_id: preprocess_3
    to_node_id: analysis_1
  - from_node_id: analysis_1
    to_node_id: viz_1
  - from_node_id: analysis_1
    to_node_id: stats_1
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: NMR spectral data
      accepted_techniques:
      - NMR
  certified_datasets: []
