schema_version: 1
name: IR OPUS Import & Analysis
slug: ir_opus_analysis
description: Import Bruker OPUS files, slice wavenumber range, apply rubberband baseline,
  normalize, and detect peaks.
category: spectroscopy
is_active: true
status: wip
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Load IR Data
    parameters:
      source: spectrochempy
      example_dataset: irdata
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: preprocess.clip_range
    label: Wavenumber Range
    parameters:
      min_wavenumber: 400
      max_wavenumber: 4000
    position_x: 425
    position_y: 300
  - node_id: preprocess_2
    node_type: baseline.rubberband
    label: Rubberband Baseline
    parameters: {}
    position_x: 175
    position_y: 550
  - node_id: preprocess_3
    node_type: preprocess.normalize
    label: SNV Normalize
    parameters:
      method: snv
    position_x: 425
    position_y: 800
  - node_id: analysis_1
    node_type: analysis.peak_finding
    label: Peak Detection
    parameters: {}
    position_x: 175
    position_y: 1050
  - node_id: stats_1
    node_type: stats.summary
    label: Peak Summary
    parameters: {}
    position_x: 450
    position_y: 1300
  edges:
  - from_node_id: data_1
    to_node_id: preprocess_1
  - from_node_id: preprocess_1
    to_node_id: preprocess_2
  - from_node_id: preprocess_2
    to_node_id: preprocess_3
  - from_node_id: preprocess_3
    to_node_id: analysis_1
  - from_node_id: analysis_1
    to_node_id: stats_1
    from_output: peaks
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: IR spectral data (OPUS, JCAMP, or CSV)
      accepted_techniques:
      - FTIR
  certified_datasets:
  - source: spectrochempy
    name: irdata
