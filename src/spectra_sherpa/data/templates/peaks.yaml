schema_version: 1
name: Peak Detection & Fitting
slug: peaks
description: Automated peak detection with Gaussian/Lorentzian fitting, FWHM, and
  area quantification.
category: spectroscopy
is_active: true
status: ready
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Load Spectra
    parameters:
      source: spectrochempy
      example_dataset: irdata
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: baseline.penalized_ls
    label: Baseline Correction
    parameters:
      method: als
      lam: 100000
      p: 0.001
    position_x: 425
    position_y: 300
  - node_id: preprocess_2
    node_type: preprocess.smooth
    label: Smoothing
    parameters:
      method: savitzky_golay
      size: 11
      order: 3
    position_x: 175
    position_y: 550
  - node_id: analysis_1
    node_type: analysis.peak_finding
    label: Peak Detection
    parameters: {}
    position_x: 50
    position_y: 800
  - node_id: stats_1
    node_type: stats.summary
    label: Peak Table
    parameters: {}
    position_x: 100
    position_y: 1050
  - node_id: viz_2
    node_type: output.plot
    label: Smoothed Spectra
    parameters:
      plot_type: spectra
    position_x: 500
    position_y: 1050
  edges:
  - from_node_id: data_1
    to_node_id: preprocess_1
  - from_node_id: preprocess_1
    to_node_id: preprocess_2
  - from_node_id: preprocess_2
    to_node_id: analysis_1
  - from_node_id: preprocess_2
    to_node_id: viz_2
  - from_node_id: analysis_1
    to_node_id: stats_1
    from_output: peaks
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Spectral data for peak analysis
      accepted_techniques:
      - FTIR
      - NIR
      - Raman
      - UV-Vis
      - NMR
  certified_datasets:
  - source: spectrochempy
    name: irdata
  - source: spectrochempy
    name: ramandata
  - source: spectrochempy
    name: matlabdata/als2004dataset.MAT
  - source: eigenvector
    name: diesel_nir
  - source: eigenvector
    name: diesel_nir_mat
  - source: eigenvector
    name: corn_m5
  - source: eigenvector
    name: corn_mp5
  - source: eigenvector
    name: corn_mp6
  - source: eigenvector
    name: cgl_nir
  - source: eigenvector
    name: nir_shootout_cal1
  - source: eigenvector
    name: nir_shootout_cal2
  - source: eigenvector
    name: nir_shootout_test1
  - source: eigenvector
    name: nir_shootout_test2
  - source: eigenvector
    name: metal_etch_oes
