schema_version: 1
name: Quality Control (SIMCA)
slug: simca_qc
description: Build a SIMCA model for quality control and outlier detection based on
  reference class.
category: quality_control
is_active: true
data_modalities:
- spectra
- features
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Load Reference Data
    parameters:
      source: sklearn
      sklearn_dataset: wine
    position_x: 175
    position_y: 50
  - node_id: preprocess_1
    node_type: preprocess.scale
    label: Autoscale
    parameters:
      method: autoscale
    position_x: 425
    position_y: 300
  - node_id: model_1
    node_type: classification.simca
    label: Train SIMCA Classifier
    parameters:
      n_components: 3
      confidence_level: 0.95
    position_x: 175
    position_y: 550
  - node_id: viz_1
    node_type: output.plot
    label: SIMCA Acceptance Plot
    parameters:
      plot_type: scatter
      plot_key: simca_acceptance
    position_x: 425
    position_y: 800
  edges:
  - from_node_id: data_1
    to_node_id: preprocess_1
  - from_node_id: preprocess_1
    to_node_id: model_1
    to_input: X
  - from_node_id: model_1
    to_node_id: viz_1
    from_output: plots
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Reference-class spectra for SIMCA model
      accepted_data_roles:
      - X_spectra
      - X_features
      accepted_techniques:
      - FTIR
      - NIR
      - Raman
    class_labels:
      role_type: class_labels
      node_binding: data_1
      required: true
      binding_mode: embedded
      target_type: categorical
      description: Classification labels (column in spectral data file)
  certified_datasets:
  - source: sklearn
    name: wine
  - source: sklearn
    name: iris
  - source: sklearn
    name: breast_cancer
