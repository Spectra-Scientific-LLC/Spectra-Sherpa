schema_version: 1
name: MCR-ALS Curve Resolution
slug: mcr_als
description: Multivariate Curve Resolution - Alternating Least Squares for resolving
  overlapping spectral components.
category: curve_resolution
is_active: true
template_data:
  nodes:
  - node_id: data_1
    node_type: data.source
    label: Load Data
    parameters:
      source: spectrochempy
      example_dataset: irdata
    position_x: 175
    position_y: 50
  - node_id: model_1
    node_type: model.mcr_als
    label: MCR-ALS
    parameters:
      n_components: 3
      max_iter: 50
      tol: 0.1
    position_x: 425
    position_y: 300
  - node_id: viz_1
    node_type: output.plot
    label: Resolved Spectra
    parameters:
      plot_type: spectra
    position_x: 225
    position_y: 550
  - node_id: viz_2
    node_type: output.plot
    label: Concentrations
    parameters:
      plot_type: spectra
    position_x: 625
    position_y: 550
  edges:
  - from_node_id: data_1
    to_node_id: model_1
  - from_node_id: model_1
    to_node_id: viz_1
    from_output: St
  - from_node_id: model_1
    to_node_id: viz_2
    from_output: C
  canvas_state:
    zoom: 1.0
    pan_x: 0
    pan_y: 0
  data_roles:
    X_spectra:
      role_type: X_spectra
      node_binding: data_1
      required: true
      binding_mode: embedded
      description: Spectral mixture data (time-resolved or multi-component)
      accepted_techniques:
      - FTIR
      - NIR
      - Raman
      - UV-Vis
