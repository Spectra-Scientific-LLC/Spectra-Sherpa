# Fast source checks only. Builds are disposable; never stage static bundles.
repos:
  - repo: https://github.com/psf/black
    rev: "26.3.1"
    hooks:
      - id: black
        files: ^(src|tests)/
        args: [--line-length=120]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.17"
    hooks:
      - id: ruff
        files: ^(src|tests)/

  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend package configuration)
        entry: python scripts/frontend_lint.py
        language: system
        files: ^frontend/src/.*\.(ts|vue)$
        pass_filenames: false

      - id: prettier
        name: Prettier (installed frontend tool)
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --check
        language: system
        files: ^frontend/src/.*\.(ts|vue|css)$
        pass_filenames: true

      - id: user-copy
        name: Bounded user-copy terminology
        entry: python scripts/check_user_copy.py
        language: system
        files: ^(frontend/src/.*\.vue|docs/workflows/.*\.md|docs/developers/user-copy-baseline\.json)$
        pass_filenames: false
