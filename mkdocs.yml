site_name: SpectraSherpa Documentation
site_url: https://docs.spectrascientific.ai
repo_url: https://github.com/Spectra-Scientific-LLC/Spectra-Sherpa
repo_name: Spectra-Scientific-LLC/Spectra-Sherpa
edit_uri: edit/main/docs/
nav:
  - Home: index.md
  - User Guide:
      - Installation: user/installation.md
      - Configuration: user/configuration.md
      - Quickstart: user/quickstart.md
      - Experiments: user/experiments.md
      - Library (NIST): user/library.md
      - DOE (96-Well): user/doe.md
      - Synthesis Builder: user/synthesis.md
      - Workflow Builder: user/workflow.md
      - Reproduction Study:
          - PCA (Side-by-Side): user/case_study_pca.md
          - Methodology: user/reproduction_methodology.md
      - User Manual: user/manual.md
  - Developer Guide:
      - Setup & Contributing: dev/setup.md
      - Architecture: dev/architecture.md
      - Your First Node: dev/first_plugin.md
  - Examples:
      - 00. Case Study Notebook: user/examples/00_case_study_notebook.ipynb
      - 01. Loading Data: user/examples/01_loading_data.md
      - 02. Manipulation: user/examples/02_dataset_manipulation.md
      - 03. Plotting: user/examples/03_plotting.md
      - 04. Smoothing: user/examples/04_preprocessing_smoothing.md
      - 05. Baseline: user/examples/05_preprocessing_baseline.md
      - 06. Peak Finding: user/examples/06_peak_finding.md
      - 07. Integration: user/examples/07_peak_fitting.md
      - 08. PCA: user/examples/08_pca.md
      - 09. MCR-ALS: user/examples/09_mcr_als.md
      - 10. PLS: user/examples/10_pls_regression.md
  - Reference:
      - Node Library: user/reference/nodes.md
theme:
  name: material
  logo: assets/ss-logo.png
  favicon: assets/ss-logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.action.edit
plugins:
  - search
  - mkdocs-jupyter
copyright: Copyright &copy; 2025-2026 Spectra Scientific LLC
dev_addr: "127.0.0.1:8100"
