theme:
  name: material
  logo: assets/ss-logo.png
  favicon: assets/ss-logo.png
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
extra_css:
  - styles/site.css
plugins:
  - search
  - mkdocs-jupyter
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
copyright: Copyright &copy; 2026 Spectra Scientific LLC
dev_addr: "127.0.0.1:8100"
