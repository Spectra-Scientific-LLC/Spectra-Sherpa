  - Data Workflows:
      - Data Import: workflows/data-import.md
      - Projects, Datasets, and Runs: workflows/projects-datasets-runs.md
      - Preprocessing Spectra: workflows/preprocessing.md
      - Reports and Exports: workflows/reports-exports.md
      - Reference Libraries and Synthesis: workflows/references-synthesis.md
  - Chemometrics:
      - Overview: chemometrics/index.md
      - PCA and Exploratory Analysis: chemometrics/pca.md
      - PLS Calibration: chemometrics/pls.md
      - Classification: chemometrics/classification.md
      - SIMCA QC: chemometrics/simca.md
      - MCR-ALS and Curve Resolution: chemometrics/mcr-als.md
      - Peak Finding and Library Comparison: chemometrics/peaks-library.md
      - Validation and Model Application: chemometrics/validation-application.md
  - Node Library:
      - Overview: nodes/index.md
      - Data Nodes: nodes/data.md
      - Preprocessing Nodes: nodes/preprocessing.md
      - Exploratory Nodes: nodes/exploratory.md
      - Regression Nodes: nodes/regression.md
      - Classification Nodes: nodes/classification.md
      - Selection and Validation Nodes: nodes/selection-validation.md
      - Output Nodes: nodes/output.md
      - Optional SpectroChemPy Nodes: nodes/spectrochempy.md
  - Templates:
      - Templates: workflow-templates/index.md
      - PCA Starter: workflow-templates/pca.md
      - PLS Calibration Starter: workflow-templates/pls-calibration.md
      - Classification Starters: workflow-templates/classification.md
      - MCR-ALS Starter: workflow-templates/mcr-als.md
      - Peak ID and Library Comparison: workflow-templates/peaks-library.md
  - Architecture:
      - System Overview: architecture/index.md
      - SherpaDataset Foundation: architecture/sherpa-dataset.md
      - Workflow Execution: architecture/workflows.md
      - Model Artifacts: architecture/model-artifacts.md
      - Plugins and Extension Points: architecture/plugins.md
      - Export Design: architecture/export.md
  - OSS Developers:
      - Developer Setup: developers/setup.md
      - Contributing: developers/contributing.md
      - Writing a Plugin Node: developers/plugin-node.md
