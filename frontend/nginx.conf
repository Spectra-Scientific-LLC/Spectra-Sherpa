# Access logs omit queries/Referer; nginx_safe_logs.py sanitizes error stderr.
# Keep the original route even after an internal SPA rewrite to /index.html.
map $request_uri $sherpa_request_path {
    ~^(?<sherpa_path_without_query>[^?]*) $sherpa_path_without_query;
    default "";
}
log_format sherpa_access '$remote_addr [$time_local] "$request_method $sherpa_request_path $server_protocol" '
                         '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name localhost;
    error_log stderr warn;
    access_log /var/log/nginx/access.log sherpa_access;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense-in-depth — Caddy also sets these at the edge)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Limit request body size (match backend MAX_FILE_SIZE_MB)
    client_max_body_size 200m;

    # Gzip Compression
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend service
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeout for long-running compute jobs
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy WebSocket connections
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket specific timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
