name: Rebuild Frontend Static Bundle

on:
  workflow_dispatch:

# Default token permissions: read-only.  The rebuilt bundle is
# uploaded as a workflow artifact; no commits flow back to the repo.
permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild static bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload rebuilt static bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-static-bundle
          path: src/spectra_sherpa/static
