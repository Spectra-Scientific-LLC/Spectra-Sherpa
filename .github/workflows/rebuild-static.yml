name: Rebuild Frontend Static Bundle

on:
  workflow_dispatch:

jobs:
  rebuild:
    name: Rebuild static bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload rebuilt static bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-bundle
          path: src/spectra_sherpa/static
