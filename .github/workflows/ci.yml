name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install "black>=24.4,<25" "ruff>=0.5,<1" mypy

      - name: black --check
        run: black --check src/ tests/

      - name: ruff check
        run: ruff check src/ tests/

      - name: mypy (core modules)
        run: mypy src/spectra_sherpa/app/core/ --no-error-summary

      - name: mypy (dag nodes — warning mode, ratchet down over time)
        run: mypy src/spectra_sherpa/app/services/dag/ --no-error-summary
        continue-on-error: true

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev --extras sherpa

      - name: No bare app.* imports
        run: |
          if grep -rn -E '^[[:space:]]*(from|import)[[:space:]]+app(\.|[[:space:]]|$)' src/ tests/ scripts/ *.py --include='*.py'; then
            echo "::error::Bare 'app.*' imports found. Use 'spectra_sherpa.app.*' instead."
            exit 1
          fi

      - name: No bare app.* patch targets
        run: |
          if grep -rn -E 'patch\([[:space:]]*['"'"'"]app\.|monkeypatch\.setattr\([[:space:]]*['"'"'"]app\.' tests/ *.py --include='*.py'; then
            echo "::error::Bare 'app.*' patch targets found. Use 'spectra_sherpa.app.*' instead."
            exit 1
          fi

      - name: Run tests
        run: |
          poetry run pytest tests/ -v --no-cov

  scp-compat:
    name: SCP Compat (3.11 / ${{ matrix.scp_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scp_version: ["0.8.1"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set runtime env vars
        run: |
          echo "SCP_CONFIG_HOME=${{ runner.temp }}/scp-config" >> "$GITHUB_ENV"
          echo "SCP_PROJECTS_HOME=${{ runner.temp }}/scp-projects" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=${{ runner.temp }}/mplconfig" >> "$GITHUB_ENV"

      - name: Install Poetry
        run: pip install poetry

      - name: Install base dependencies
        run: poetry install --with dev --extras sherpa

      - name: Prepare writable runtime dirs
        run: mkdir -p "$SCP_CONFIG_HOME" "$SCP_PROJECTS_HOME" "$MPLCONFIGDIR"

      - name: Pin SpectroChemPy version
        run: poetry run pip install "spectrochempy==${{ matrix.scp_version }}"

      - name: Run SCP compatibility suite
        run: |
          poetry run pytest \
            tests/test_scp_compat.py \
            tests/test_modeling_nodes.py \
            tests/test_data_loading_golden.py \
            tests/test_notebook_export.py \
            tests/test_eigenvector_datasets.py \
            tests/test_executor_pool.py -k "not PoolExecution" \
            -v --no-cov

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # ------------------------------------------------------------------
      # OpenAPI → TypeScript drift guard.
      #
      # `frontend/src/types/api-generated.ts` is generated by openapi-typescript
      # from `spectra-server/docs/contracts/openapi-llm-v1.json` (the
      # authoritative published OpenAPI contract for /api/v1/llm/**).
      #
      # This job sparse-checks-out only that one file from spectra-server,
      # regenerates the TS client into /tmp, and fails CI if the committed
      # file does not match. Forces every PR that bumps the spec to also
      # bump the generated types in the same change.
      #
      # Requires `secrets.SERVER_CHECKOUT_TOKEN` (a fine-grained PAT with
      # read access to Spectra-Scientific-LLC/spectra-server). If that
      # repo becomes public, the `token:` line can be removed.
      # ------------------------------------------------------------------
      - name: Check out spectra-server (sparse — OpenAPI spec only)
        uses: actions/checkout@v5
        with:
          repository: Spectra-Scientific-LLC/spectra-server
          token: ${{ secrets.SERVER_CHECKOUT_TOKEN }}
          path: _spectra_server
          sparse-checkout: docs/contracts
          sparse-checkout-cone-mode: false

      - name: Verify api-generated.ts matches committed OpenAPI spec
        working-directory: frontend
        run: |
          npx openapi-typescript \
            "$GITHUB_WORKSPACE/_spectra_server/docs/contracts/openapi-llm-v1.json" \
            -o /tmp/api-generated.expected.ts
          if ! diff -q src/types/api-generated.ts /tmp/api-generated.expected.ts > /dev/null; then
            echo "::error::frontend/src/types/api-generated.ts is stale."
            echo "::error::Run 'cd frontend && npm run generate:types' locally and commit the result."
            diff -u src/types/api-generated.ts /tmp/api-generated.expected.ts | head -120
            exit 1
          fi
          echo "api-generated.ts matches the committed OpenAPI spec."

      - name: ESLint
        # Phase B: existing warnings (no-explicit-any, no-unused-vars).
        # This threshold should only decrease — never increase.
        run: npx eslint src/ --max-warnings 310
        working-directory: frontend

      - name: TypeScript check
        run: npx vue-tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Verify build produced index.html and all referenced assets
        run: |
          if [ ! -f "src/spectra_sherpa/static/index.html" ]; then
            echo "::error::Build did not produce src/spectra_sherpa/static/index.html"
            exit 1
          fi

          # Verify every asset referenced in static/index.html exists
          grep -oP '/assets/[^"]+' src/spectra_sherpa/static/index.html | while read -r asset; do
            if [ ! -f "src/spectra_sherpa/static${asset}" ]; then
              echo "::error::Missing asset: src/spectra_sherpa/static${asset}"
              exit 1
            fi
          done

          echo "Build produced index.html and all referenced assets."

      - name: Warn if static bundle is stale
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain -- src/spectra_sherpa/static)" ]; then
            echo "::warning::Committed static bundle is stale — frontend source changed after the last build."
            echo "::warning::Trigger the 'Rebuild Frontend Static Bundle' workflow and commit the updated assets."
            git status --short -- src/spectra_sherpa/static
          else
            echo "Static bundle is up to date."
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Bandit (medium+ severity)
        run: bandit -r src/ -ll -q

      - name: pip-audit (dependency CVEs)
        run: |
          pip install poetry poetry-plugin-export
          poetry export -f requirements.txt --without-hashes --extras sherpa --extras cloud -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt

  docs:
    name: Docs Build & Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install mkdocs
        run: pip install "mkdocs<2" "mkdocs-material<9.7" mkdocs-jupyter

      - name: Build docs
        run: mkdocs build --strict

      - name: Demo-string hygiene check
        run: |
          # Fail if any doc uses APP_MODE=demo or mode="demo" outside of
          # clearly-marked deprecation notes.
          HITS=$(grep -rn 'APP_MODE=demo\|mode="demo"\|mode=demo\b' \
            docs/ \
            --include='*.md' \
            | grep -iv 'deprecat\|backward.compat\|maps.*enterprise\|accepted.*alias' || true)

          if [ -n "$HITS" ]; then
            echo "::error::Stale 'demo' references found in docs:"
            echo "$HITS"
            exit 1
          fi
          echo "No stale demo references in docs."
