name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Pull requests run on Ubuntu. Pushes to main (curated publishes and merged
  # public PRs), the weekly run and manual dispatch add Windows and macOS, so
  # every released commit is qualified on all three platforms. The weekly run
  # also catches dependency and runner-image drift between releases. See the
  # dual-repo CI policy in the monorepo (docs/dev/dual-repo-ci-policy.md).
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Default token permissions: read-only.  Jobs only run linters, tests,
# and builds — no writes back to the repo.
permissions:
  contents: read

jobs:
  references:
    name: Standalone reference preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/verify_public_references.py

  lint:
    name: Lint
    needs: references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install "black>=26.3.1,<27" "ruff>=0.5,<1" "mypy<2"

      - name: Bounded user-copy terminology
        run: python scripts/check_user_copy.py

      - name: black --check
        run: black --check src/ tests/

      - name: ruff check
        run: ruff check src/ tests/

      - name: No server imports in OSS source
        run: |
          SERVER_MODULE="spectrasherpa_""server"
          if grep -rn -E "^[[:space:]]*(from|import)[[:space:]]+${SERVER_MODULE}(\\.|[[:space:]]|$)" \
               src/ --include="*.py"; then
            echo "::error::OSS imports from the server implementation package — this crosses the boundary"
            exit 1
          fi

      - name: No server package references in frontend runtime code
        run: |
          SERVER_PACKAGE="spectra-""server"
          SERVER_MODULE="spectrasherpa_""server"
          HITS=$(grep -rn -E "(${SERVER_PACKAGE}|${SERVER_MODULE})" \
                   frontend/src/ \
                   --include="*.ts" --include="*.vue" --include="*.js" \
                 | grep -v "/types/api-generated\.ts:" \
                 | grep -vE ':[[:space:]]*//' \
                 | grep -vE ':[[:space:]]*\*' \
                 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::OSS frontend references the server package by name in runtime code"
            exit 1
          fi

      - name: mypy (core modules)
        run: mypy --follow-imports=silent src/spectra_sherpa/app/core/ --no-error-summary

      - name: mypy (dag nodes — warning mode, ratchet down over time)
        run: mypy src/spectra_sherpa/app/services/dag/ --no-error-summary || true

  backend:
    name: Backend Tests (${{ matrix.os }} / ${{ matrix.install_profile }})
    needs: references
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu on pull requests; Linux, macOS and Windows on push to main,
        # weekly and manual dispatch. Keep in sync with desktop-shell.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        install_profile:
          - base
          - postgres
    services:
      publication-postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && matrix.install_profile == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        # Force bash on every runner so the existing POSIX-style ``if [...]``
        # and ``grep`` snippets keep working on windows-latest (Git Bash
        # ships preinstalled).
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          if [ "${{ matrix.install_profile }}" = "postgres" ]; then
            poetry install --with dev --extras postgres
          else
            poetry install --with dev
          fi

      - name: No bare app.* imports
        run: |
          if grep -rn -E '^[[:space:]]*(from|import)[[:space:]]+app(\.|[[:space:]]|$)' src/ tests/ scripts/ *.py --include='*.py'; then
            echo "::error::Bare 'app.*' imports found. Use 'spectra_sherpa.app.*' instead."
            exit 1
          fi

      - name: No bare app.* patch targets
        run: |
          if grep -rn -E 'patch\([[:space:]]*['"'"'"]app\.|monkeypatch\.setattr\([[:space:]]*['"'"'"]app\.' tests/ *.py --include='*.py'; then
            echo "::error::Bare 'app.*' patch targets found. Use 'spectra_sherpa.app.*' instead."
            exit 1
          fi

      - name: Run tests
        id: public_tests
        env:
          PYTEST_ADDOPTS: --durations=0 --durations-min=0
          PUBLICATION_TEST_POSTGRES_URL: ${{ matrix.os == 'ubuntu-latest' && matrix.install_profile == 'postgres' && 'postgresql+asyncpg://postgres@127.0.0.1:5432/postgres' || '' }}
          REQUIRE_PUBLICATION_POSTGRES: ${{ matrix.os == 'ubuntu-latest' && matrix.install_profile == 'postgres' && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p ci-test-timings
          poetry run python scripts/run_public_tests.py 2>&1 | tee ci-test-timings/pytest.log

      - name: Record backend test timing context
        if: always()
        env:
          MATRIX_OS: ${{ matrix.os }}
          INSTALL_PROFILE: ${{ matrix.install_profile }}
          TEST_OUTCOME: ${{ steps.public_tests.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          output = Path("ci-test-timings")
          output.mkdir(exist_ok=True)
          log = output / "pytest.log"
          metadata = {
              "source_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "event_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "matrix_os": os.environ["MATRIX_OS"],
              "install_profile": os.environ["INSTALL_PROFILE"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "python_version": platform.python_version(),
              "test_outcome": os.environ["TEST_OUTCOME"],
              "pytest_log_sha256": hashlib.sha256(log.read_bytes()).hexdigest() if log.is_file() else None,
          }
          (output / "metadata.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload backend test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-timings-${{ matrix.os }}-${{ matrix.install_profile }}-${{ github.run_attempt }}
          path: ci-test-timings/
          if-no-files-found: error
          retention-days: 7

      - name: Public evidence and governance check
        if: matrix.os == 'ubuntu-latest' && matrix.install_profile == 'base'
        run: make evidence-check

  desktop-shell:
    name: Desktop shell tests (${{ matrix.os }})
    needs: references
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same platform rule as the backend matrix.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    env:
      # Unit tests exercise the shell modules with Node only; packaging and
      # the Electron binary belong to desktop-release.yml.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json

      - name: Install shell dependencies
        run: npm ci
        working-directory: desktop/electron

      - name: Run shell unit tests
        run: npm test
        working-directory: desktop/electron

  scp-compat:
    name: SCP Compat (3.11 / ${{ matrix.scp_version }})
    needs: references
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scp_version: ["0.8.1"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set runtime env vars
        run: |
          echo "SCP_CONFIG_HOME=${{ runner.temp }}/scp-config" >> "$GITHUB_ENV"
          echo "SCP_PROJECTS_HOME=${{ runner.temp }}/scp-projects" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=${{ runner.temp }}/mplconfig" >> "$GITHUB_ENV"

      - name: Install Poetry
        run: pip install poetry

      - name: Install base dependencies
        run: poetry install --with dev

      - name: Prepare writable runtime dirs
        run: mkdir -p "$SCP_CONFIG_HOME" "$SCP_PROJECTS_HOME" "$MPLCONFIGDIR"

      - name: Pin SpectroChemPy version
        run: poetry run pip install "spectrochempy==${{ matrix.scp_version }}"

      - name: Run SCP compatibility suite
        run: |
          poetry run pytest \
            tests/test_scp_contracts.py \
            tests/test_scp_node_contracts.py \
            tests/test_c2_scp_unmixing_contracts.py \
            tests/test_nddataset_containment.py \
            tests/test_algo_audit_fixes.py \
            tests/test_artifact_emission.py \
            tests/test_node_result_contract.py \
            tests/test_modeling_nodes.py \
            tests/test_data_loading_golden.py \
            tests/test_notebook_export.py \
            tests/test_eigenvector_datasets.py \
            tests/test_executor_pool.py -k "not PoolExecution" \
            -v --no-cov

  frontend:
    name: Frontend Build
    needs: references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify generated public API types
        working-directory: frontend
        run: npm run check:types

      - name: ESLint
        # Phase B: existing warnings (no-explicit-any, no-unused-vars).
        # This threshold should only decrease — never increase.
        run: npm run lint
        working-directory: frontend

      - name: TypeScript check
        run: npx vue-tsc --noEmit
        working-directory: frontend

      - name: Unit tests
        run: npm run test:unit -- --run
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Verify build produced index.html and all referenced assets
        run: |
          if [ ! -f "src/spectra_sherpa/static/index.html" ]; then
            echo "::error::Build did not produce src/spectra_sherpa/static/index.html"
            exit 1
          fi

          # Verify every asset referenced in static/index.html exists
          grep -oP '/assets/[^"]+' src/spectra_sherpa/static/index.html | while read -r asset; do
            if [ ! -f "src/spectra_sherpa/static${asset}" ]; then
              echo "::error::Missing asset: src/spectra_sherpa/static${asset}"
              exit 1
            fi
          done

          echo "Build produced index.html and all referenced assets."

      - name: Refuse tracked Vite output
        run: |
          if [ -n "$(git ls-files src/spectra_sherpa/static)" ]; then
            echo "::error::Vite output must be generated by qualification, never tracked in git."
            exit 1
          fi

      - name: Rebuild independently for deterministic byte comparison
        working-directory: frontend
        env:
          SHERPA_FRONTEND_OUT_DIR: /tmp/spectra-sherpa-static-rebuild
        run: npx vite build

      - name: Set up Python 3.11 for artifact qualification
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify deterministic regeneration and distribution parity
        run: |
          python scripts/qualify_release_artifacts.py compare-frontends \
            --left src/spectra_sherpa/static \
            --right /tmp/spectra-sherpa-static-rebuild
          python -m pip install "build==1.4.4"
          python -m build --outdir /tmp/spectra-sherpa-release-ci/dist
          python scripts/qualify_release_artifacts.py verify-frontends \
            --dist /tmp/spectra-sherpa-release-ci/dist \
            --bundle src/spectra_sherpa/static

  scientific-browser:
    name: Scientific browser (${{ matrix.os }})
    needs: references
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Qualify the actual launcher and browser, not only Python/shell tests.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install scientific browser runtime
        run: python -m pip install -e .
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Install scientific browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Scientific browser PR smoke
        if: github.event_name == 'pull_request'
        working-directory: frontend
        run: npm run test:science:smoke

      - name: Scientific browser qualification
        if: github.event_name != 'pull_request'
        working-directory: frontend
        run: npm run test:science

      - name: Verify owned server stopped
        if: always()
        run: |
          python - <<'PY'
          import socket
          with socket.socket() as probe:
              probe.settimeout(2)
              if probe.connect_ex(("127.0.0.1", 8041)) == 0:
                  raise SystemExit("Scientific browser launcher left its server running")
          PY

      - name: Scientific browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scientific-browser-${{ matrix.os }}
          path: |
            frontend/scientific-browser-results/
            frontend/scientific-browser-report/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security Scan
    needs: references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install scanners
        run: pip install bandit pip-audit poetry poetry-plugin-export

      - name: Bandit (medium+ severity)
        run: bandit -r src/ -ll -q

      - name: Dependency audit (Python and full frontend/desktop locks)
        run: python scripts/audit_dependencies.py --repo . --all-extras-mode warn --frontend-scope full

  docs:
    name: Docs Build & Hygiene
    needs: references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install mkdocs
        run: pip install "mkdocs<2" "mkdocs-material<9.7" mkdocs-jupyter

      - name: Build docs
        run: |
          python scripts/check_public_docs.py
          mkdocs build --strict

      - name: Check help destinations in built documentation
        run: python scripts/check_built_help.py --site-dir site

      - name: Demo-string hygiene check
        run: |
          # Fail if any doc uses APP_MODE=demo or mode="demo" outside of
          # clearly-marked deprecation notes.
          HITS=$(grep -rn 'APP_MODE=demo\|mode="demo"\|mode=demo\b' \
            docs/ \
            --include='*.md' \
            | grep -iv 'deprecat\|backward.compat\|maps.*enterprise\|accepted.*alias' || true)

          if [ -n "$HITS" ]; then
            echo "::error::Stale 'demo' references found in docs:"
            echo "$HITS"
            exit 1
          fi
          echo "No stale demo references in docs."

  verdict:
    name: CI verdict
    if: ${{ always() }}
    needs: ['references', 'lint', 'backend', 'desktop-shell', 'scp-compat', 'frontend', 'scientific-browser', 'security', 'docs']
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = set(['references', 'lint', 'backend', 'desktop-shell', 'scp-compat', 'frontend', 'scientific-browser', 'security', 'docs'])
          if set(results) != expected or any(item.get("result") != "success" for item in results.values()):
              raise SystemExit("CI is incomplete or unsuccessful: " + str(results))
          PYTHON
