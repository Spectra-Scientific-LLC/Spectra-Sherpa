name: Dispatch merged PR to monorepo

# On every PR merge into main of the public Spectra-Sherpa repo, fire a
# repository_dispatch event on the private spectra monorepo so its
# sync-oss-prs.yml workflow can create a bot PR with the change.
#
# This file lives here (inside the OSS package) so that mirror.yml's
# force-push from the monorepo does not delete it from the public repo.
# GitHub Actions reads .github/workflows/ from the REPO ROOT; once
# mirror.yml runs, packages/spectra-sherpa/.github/workflows/ becomes
# .github/workflows/ on the public repo.

on:
  pull_request:
    types: [closed]
    branches: [main]

# Default token permissions: read-only.  The repository_dispatch call
# to the private monorepo runs under a GitHub App installation token
# minted at run time, so the default ``GITHUB_TOKEN`` does not need
# write scopes.
permissions:
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: Spectra-Scientific-LLC
          repositories: spectra

      - name: Fire repository_dispatch on monorepo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            -X POST \
            "repos/Spectra-Scientific-LLC/spectra/dispatches" \
            -f event_type=oss-pr-merged \
            -f 'client_payload[pr_number]=${{ github.event.pull_request.number }}'
