name: Saved-model compatibility

# Models users saved with a published release must keep applying after an
# upgrade, and models the candidate fits must apply. The check fits and
# applies real models (about ten minutes), so pull requests run it only when
# they touch serialization, identity, persistence or replay code.
# Policy: rule 6 of the monorepo's docs/dev/dual-repo-ci-policy.md.
#
# Both repositories use scripts/saved_model_compat_paths.json in the OSS
# package. Scope is evaluated inside the workflow so its required verdict
# always reports, including an explicit skip for unrelated ready PRs.
# Add new serialization/identity/persistence/replay paths to that shared list.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Public main moves only when a curated release is published; check every one.
  push:
    branches: [main]
  # Weekly as well: a dependency release can break compatibility with no PR.
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: saved-model-compat-${{ github.event_name }}-${{ github.ref }}
  # Only a superseded PR run may be cancelled; every published commit and
  # weekly run must report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Detect compatibility scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
      deferred: ${{ steps.scope.outputs.deferred }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Read the PR's current draft state so rerunning a verdict that
          # failed while the PR was a draft passes once it is ready.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_compat_scope.py --prefix ""

  compat:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: Saved-model upgrade and round trip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install candidate
        run: |
          pip install poetry
          poetry install

      - name: Check reviewed reference releases and the candidate round trip
        run: bash scripts/run_saved_model_compat.sh "$RUNNER_TEMP/compat" "$GITHUB_STEP_SUMMARY"

  verdict:
    name: Saved-model compatibility verdict
    if: ${{ always() }}
    needs: [scope, compat]
    runs-on: ubuntu-latest
    steps:
      - name: Require complete compatibility evidence
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.required }}
          DEFERRED: ${{ needs.scope.outputs.deferred }}
          COMPAT_RESULT: ${{ needs.compat.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$DEFERRED" = false
          case "$REQUIRED:$COMPAT_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::Compatibility evidence missing or unsuccessful"; exit 1 ;;
          esac
