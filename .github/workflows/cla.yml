name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/Spectra-Scientific-LLC/Spectra-Sherpa/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: fe2val,dependabot[bot],github-actions[bot],renovate[bot]
          lock-pullrequest-aftermerge: true
          create-file-commit-message: "chore: create CLA signatures file"
          # NOTE: $pullRequestNo isn't reliably substituted by
          # contributor-assistant/github-action@v2.6.1 (the $contributorName,
          # $owner, and $repo placeholders expand, but $pullRequestNo ends
          # up as a literal in the commit message — see commit 47069b3b on
          # the cla-signatures branch for evidence).  The PR number is
          # already recorded in signatures/cla.json under each entry's
          # ``pullRequestNo`` field, so dropping it from the commit
          # message subject has zero information loss and avoids the
          # cosmetic issue in future signature commits.
          signed-commit-message: "docs: $contributorName signed the CLA for $owner/$repo"
          custom-notsigned-prcomment: |
            Thank you for your submission! Spectra Sherpa is dual-licensed (AGPLv3 + Commercial)
            and requires a signed Contributor License Agreement before we can merge your code.

            **Individuals:** Read our [Individual CLA](https://github.com/Spectra-Scientific-LLC/Spectra-Sherpa/blob/main/CLA.md)
            **Organizations:** Read our [Entity CLA](https://github.com/Spectra-Scientific-LLC/Spectra-Sherpa/blob/main/CLA-entity.md) (requires offline signature — contact maintainers)

            To sign the Individual CLA, comment on this PR with exactly:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "**CLA Assistant** All contributors have signed the CLA. Ready for review!"
