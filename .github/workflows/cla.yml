name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronized, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-cla: "CLA.md"
          branch: "main"
          allowlist: bot*
          create-file-commit-message: "chore: Create file for storing CLA Signatures"
          signed-commit-message: "docs: $contributorName has signed the CLA in $owner/$repo#$pullRequestNo"
          custom-notsigned-prcomment: "Thank you for your submission! We are a dual-licensed project (AGPLv3 + Commercial). To get your code merged, please read our [CLA](https://github.com/Spectra-Scientific-LLC/spectrasherpa/blob/main/CLA.md) and comment on this PR with the following message to sign:"
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "**CLA Assistant** All Contributors have signed the CLA. Ready for review!"
