name: SpectraSherpa Python CodeQL

paths:
  - src

paths-ignore:
  - src/spectra_sherpa/static/**
  - tests/**

# SpectraSherpa OSS intentionally supports user-selected local filesystem
# inputs in desktop/local mode. Multi-user API paths are separately contained
# under DATA_DIR and covered by regression tests. GitHub CodeQL's generic
# py/path-injection query cannot distinguish those two product modes, so keep
# CodeQL enabled while excluding this one noisy rule.
query-filters:
  - exclude:
      id: py/path-injection
