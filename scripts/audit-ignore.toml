# Reviewed pip-audit suppressions for the public Spectra-Sherpa dependency gate.
#
# Add entries only when an advisory is understood, cannot be fixed immediately,
# and the release should proceed with a documented risk decision. Every entry
# must include a non-empty id and reason; expires is optional but recommended.
#
# Example:
#
# [[pip-audit.ignore]]
# id = "GHSA-xxxx-yyyy-zzzz"
# reason = "Optional extra only; vulnerable code path is not used by Spectra-Sherpa."
# expires = "2026-07-31"

[pip-audit]
ignore = []

# Reviewed npm-audit suppressions for the full-lockfile (dev-inclusive) gate.
# Same risk-decision contract as pip-audit, with two stricter rules: expires
# is mandatory and an expired entry fails the audit instead of waiving.
#
# Example:
#
# [[npm-audit.ignore]]
# id = "GHSA-xxxx-yyyy-zzzz"
# reason = "Dev build tooling only; vulnerable code path is not reachable at build time."
# expires = "2026-12-31"
# package = "affected-package"
# lockfile = "frontend/package-lock.json"
# severity = "high"

[npm-audit]

# Version-specific non-applicability, not acceptance of the affected algorithm.
# These legacy APIs are needed by ESLint and Redocly. Unlike modern minimatch,
# exact 3.1.5 and 5.1.9 contain neither firstPhasePreProcess nor optimizationLevel;
# the advisory's globParts amplification cannot run there. Modern branches use
# patched 11.0.3. Rechecked 2026-10-31: the advisory (updated 2026-10-30) still lists
# only < 11.0.1 with no 3.x/5.x backport. Recheck before this entry expires.
[[npm-audit.ignore]]
id = "GHSA-g3hv-75wg-m249"
reason = "Exact legacy minimatch 3.1.5/5.1.9 lack the vulnerable optimizationLevel>=2 preprocessing algorithm; independently inspected and probed. Preserve their callable/default-export APIs for ESLint/Redocly. Modern copies are patched."
expires = "2027-01-31"
package = "minimatch"
lockfile = "frontend/package-lock.json"
severity = "moderate"
versions = ["3.1.5", "5.1.9"]
