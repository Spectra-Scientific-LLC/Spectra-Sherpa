# Reviewed pip-audit suppressions for the public Spectra-Sherpa dependency gate.
#
# Add entries only when an advisory is understood, cannot be fixed immediately,
# and the release should proceed with a documented risk decision. Every entry
# must include a non-empty id and reason; expires is optional but recommended.
#
# Example:
#
# [[pip-audit.ignore]]
# id = "GHSA-xxxx-yyyy-zzzz"
# reason = "Optional extra only; vulnerable code path is not used by Spectra-Sherpa."
# expires = "2026-07-31"

[pip-audit]
ignore = []

# Reviewed npm-audit suppressions for the full-lockfile (dev-inclusive) gate.
# Same risk-decision contract as pip-audit, with two stricter rules: expires
# is mandatory and an expired entry fails the audit instead of waiving.
#
# Example:
#
# [[npm-audit.ignore]]
# id = "GHSA-xxxx-yyyy-zzzz"
# reason = "Dev build tooling only; vulnerable code path is not reachable at build time."
# expires = "2026-12-31"

[[npm-audit.ignore]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = "braces stack-exhaustion DoS is reachable only through dev build tooling (tailwindcss watcher, eslint fast-glob) with glob patterns from our own sources; the shipped runtime bundle never includes it, and no patched braces release exists."
expires = "2026-12-31"
