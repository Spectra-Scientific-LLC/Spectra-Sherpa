[tool.poetry]
name = "spectra-sherpa"
version = "0.2.1"
description = "SpectraSherpa — local-first spectroscopy platform for chemometricians"
authors = ["Spectra Scientific"]
readme = "README.md"
license = "AGPL-3.0-or-later"
packages = [{include = "spectra_sherpa", from = "src"}]
include = [
    { path = "src/spectra_sherpa/static/**/*", format = "wheel" },
    { path = "src/spectra_sherpa/data/**/*", format = "wheel" },
]

[tool.poetry.scripts]
spectra-sherpa = "spectra_sherpa.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.120.0"
starlette = ">=0.49.1"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
sqlalchemy = "^2.0.31"
aiosqlite = "^0.20.0"
alembic = "^1.13.2"
pydantic = "^2.7.4"
python-multipart = "^0.0.22"
python-dotenv = "^1.0.1"
cryptography = "^46.0.5"
httpx = "^0.27.0"
numpy = "^1.26.4"
scipy = "^1.13.1"
pandas = "^2.2.2"
beautifulsoup4 = "^4.12.3"
PyJWT = "^2.12.0"
bcrypt = ">=4.0.1"
scikit-learn = "^1.5.0"
pypdf = "^6.9.2"
openai = {version = "^1.40.0", optional = true}
spectrochempy = {version = ">=0.8.1,<0.9.0", optional = true, python = ">=3.11,<3.15"}
anthropic = {version = "^0.39.0", optional = true}
asyncpg = {version = "^0.29.0", optional = true}
greenlet = {version = ">=3.0", optional = true}
gunicorn = {version = "^22.0.0", optional = true}

[tool.poetry.extras]
# SpectroChemPy MUST remain an opt-in extra — never move to core dependencies.
# CeCILL-B is incompatible with AGPL; bundling would create a license conflict.
scp = ["spectrochempy"]
cloud = ["asyncpg", "greenlet", "gunicorn"]
sherpa = ["anthropic", "openai"]

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
ruff = "^0.5.0"
mypy = "^1.10.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=spectra_sherpa --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E402",   # module-import-not-at-top — conditional/optional imports are by design
    "E741",   # ambiguous-variable-name — X, C, l are standard in scientific code
]

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false          # gradual adoption — enable later
check_untyped_defs = true
ignore_missing_imports = true          # third-party stubs not yet added
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = "spectra_sherpa.app.core.*"
disallow_untyped_defs = false          # enable after fixing existing issues

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
