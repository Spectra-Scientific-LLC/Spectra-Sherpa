[tool.poetry]
name = "spectra-sherpa"
version = "0.5.10"
description = "SpectraSherpa — local-first spectroscopy platform for chemometricians"
authors = ["Spectra Scientific LLC <info@spectrascientific.ai>"]
readme = "README.md"
license = "AGPL-3.0"
packages = [{include = "spectra_sherpa", from = "src"}]
include = [
    { path = "src/spectra_sherpa/static/**/*", format = "wheel" },
    { path = "src/spectra_sherpa/data/**/*", format = ["sdist", "wheel"] },
    { path = "src/spectra_sherpa/contracts/**/*", format = "wheel" },
    { path = "NOTICE.md", format = ["sdist", "wheel"] },
]
keywords = [
    "chemometrics",
    "spectroscopy",
    "PLS",
    "PCA",
    "NIR",
    "Raman",
    "FTIR",
    "calibration",
    "multivariate",
    "preprocessing",
    "analytical-chemistry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: FastAPI",
]

[tool.poetry.urls]
Homepage = "https://spectrascientific.ai"
Documentation = "https://docs.spectrascientific.ai"
Repository = "https://github.com/Spectra-Scientific-LLC/Spectra-Sherpa"
"Bug Tracker" = "https://github.com/Spectra-Scientific-LLC/Spectra-Sherpa/issues"
Changelog = "https://github.com/Spectra-Scientific-LLC/Spectra-Sherpa/blob/main/CHANGELOG.md"

[tool.poetry.scripts]
spectra-sherpa = "spectra_sherpa.cli:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.120.0"
# FastAPI 0.120/0.121 still constrains Starlette to <0.50.0. Keep this
# explicit so the Host-header mitigation in SECURITY.md can be audited until
# FastAPI supports the patched Starlette 1.x line.
starlette = ">=0.49.1,<0.50.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
sqlalchemy = "^2.0.31"
aiosqlite = "^0.20.0"
alembic = "^1.13.2"
pydantic = "^2.7.4"
python-multipart = "^0.0.27"
python-dotenv = "^1.2.2"
cryptography = "^46.0.6"
httpx = "^0.27.0"
urllib3 = ">=2.7.0,<3"
idna = ">=3.15,<4"
numpy = "^1.26.4"
scipy = "^1.13.1"
pandas = "^2.2.2"
beautifulsoup4 = "^4.12.3"
scikit-learn = "^1.5.0"
pypdf = "^6.10.1"
jsonschema = "^4.20.0"
# greenlet is required at runtime by SQLAlchemy 2.x async on every platform —
# AsyncEngine.connect() bridges sync internals via greenlet_spawn regardless of
# driver (including aiosqlite). SQLAlchemy auto-pulls greenlet only on a subset
# of platforms (mainly x86_64 Linux/Windows on older Python via PEP 513 wheels);
# on Apple Silicon and Python 3.13+ it does not, and OSS local mode crashes at
# lifespan startup with "No module named 'greenlet'". Declare it as a base dep
# so the OSS standalone invariant holds on every supported platform.
greenlet = ">=3.0"
spectrochempy = {version = ">=0.8.1,<0.9.0", optional = true, python = ">=3.11,<3.15"}
hitran-api = {version = ">=1.3.0.0,<2", optional = true}
hitran-api2 = {version = ">=0.2.2,<1", optional = true}
asyncpg = {version = "^0.29.0", optional = true}
gunicorn = {version = "^22.0.0", optional = true}

[tool.poetry.extras]
# SpectroChemPy MUST remain an opt-in extra — never move to core dependencies.
# CeCILL-B is incompatible with AGPL; bundling would create a license conflict.
scp = ["spectrochempy"]
hitran = ["hitran-api", "hitran-api2"]
# `cloud` covers Postgres + production WSGI server. `greenlet` was previously
# listed here as well, but SQLAlchemy async needs it for OSS local mode (SQLite
# via aiosqlite) too — moved to base deps above.
cloud = ["asyncpg", "gunicorn"]

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
ruff = "^0.5.0"
mypy = "^1.10.0"
pytest = "^9.0.3"
pytest-asyncio = "^1.0.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=spectra_sherpa --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E402",   # module-import-not-at-top — conditional/optional imports are by design
    "E741",   # ambiguous-variable-name — X, C, l are standard in scientific code
]

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false          # gradual adoption — enable later
check_untyped_defs = true
ignore_missing_imports = true          # third-party stubs not yet added
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = "spectra_sherpa.app.core.*"
disallow_untyped_defs = false          # enable after fixing existing issues

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
