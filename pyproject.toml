[tool.poetry]
name = "spectra-sherpa"
version = "1.4.0"
description = "SpectraSherpa — local-first spectroscopy platform for chemometricians"
authors = ["Spectra Scientific"]
readme = "README.md"
license = "AGPL-3.0-or-later"
packages = [{include = "spectra_sherpa", from = "src"}]
include = [
    { path = "src/spectra_sherpa/static/**/*", format = "wheel" },
    { path = "src/spectra_sherpa/data/**/*", format = "wheel" },
]

[tool.poetry.scripts]
spectra-sherpa = "spectra_sherpa.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
sqlalchemy = "^2.0.31"
aiosqlite = "^0.20.0"
alembic = "^1.13.2"
pydantic = "^2.7.4"
python-multipart = "^0.0.9"
python-dotenv = "^1.0.1"
cryptography = "^42.0.8"
httpx = "^0.27.0"
werkzeug = "^3.0.3"
numpy = "^1.26.4"
scipy = "^1.13.1"
pandas = "^2.2.2"
matplotlib = "^3.8.0"
plotly = "^5.22.0"
beautifulsoup4 = "^4.12.3"
openai = "^1.40.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = ">=4.0.1"
scikit-learn = "^1.5.0"
pypdf = "^4.0.0"
pyarrow = "^17.0.0"
spectrochempy = {version = ">=0.6.9,<0.9.0,!=0.7.*", optional = true}
anthropic = {version = "^0.39.0", optional = true}
asyncpg = {version = "^0.29.0", optional = true}
gunicorn = {version = "^22.0.0", optional = true}

[tool.poetry.extras]
# SpectroChemPy MUST remain an opt-in extra — never move to core dependencies.
# CeCILL-B is incompatible with AGPL; bundling would create a license conflict.
scp = ["spectrochempy"]
cloud = ["asyncpg", "gunicorn"]
sherpa = ["anthropic"]

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
ruff = "^0.5.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "src/spectra_sherpa"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=spectra_sherpa --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
